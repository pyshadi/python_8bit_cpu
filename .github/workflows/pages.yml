name: Deploy dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build site
        run: |
          mkdir -p _site
          cp -r dashboard src examples _site/
          find _site -name "__pycache__" -type d -prune -exec rm -rf {} +
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Brassboard</title>
          <meta http-equiv="refresh" content="0; url=dashboard/">
          <a href="dashboard/">Open Brassboard</a>
          EOF

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
